<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="128" fill="#0e2042" stroke="#2c75ff" stroke-width="4"/>
  <circle cx="128" cy="128" r="90" fill="#000000" opacity="0.5"/>
  <!-- Helmet / Visor Silhouette -->
  <path d="M78,160 C78,100 110,70 128,70 C146,70 178,100 178,160 C178,175 170,185 128,185 C86,185 78,175 78,160 Z" fill="#2c75ff" opacity="0.3"/>
  <path d="M88,140 C88,100 112,85 128,85 C144,85 168,100 168,140 C168,155 160,165 128,165 C96,165 88,155 88,140 Z" fill="#000000"/>
  <!-- Glowing Visor -->
  <path d="M98,125 C98,110 115,105 128,105 C141,105 158,110 158,125 C158,135 141,140 128,140 C115,140 98,135 98,125 Z" fill="#1fd2c4" filter="url(#glow)"/>
  <!-- Telemetry Overlay -->
  <path d="M60,128 L70,128 M186,128 L196,128 M128,60 L128,70 M128,186 L128,196" stroke="#cfe8ff" stroke-width="2" opacity="0.5"/>
  <text x="128" y="215" fill="#cfe8ff" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="1">PLT_01</text>

</svg>