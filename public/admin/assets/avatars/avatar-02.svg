<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="128" fill="#0e2042" stroke="#ebcb4c" stroke-width="4"/>
  <circle cx="128" cy="128" r="90" fill="#000000" opacity="0.5"/>
  <!-- Face/Eye-piece Silhouette -->
  <path d="M88,170 C80,120 100,75 128,75 C156,75 176,120 168,170 C164,180 150,185 128,185 C106,185 92,180 88,170 Z" fill="#ff9f1c" opacity="0.3"/>
  <circle cx="128" cy="125" r="40" fill="#000000"/>
  <!-- Glowing Eye-piece / HUD scanner -->
  <path d="M100,120 L156,120 L156,132 L100,132 Z" fill="#ebcb4c" filter="url(#glow)"/>
  <line x1="128" y1="100" x2="128" y2="150" stroke="#cc4b37" stroke-width="2" opacity="0.6"/>
  <text x="128" y="215" fill="#cfe8ff" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="1">ENG_02</text>

</svg>