<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="128" fill="#0e2042" stroke="#cc4b37" stroke-width="4"/>
  <circle cx="128" cy="128" r="90" fill="#000000" opacity="0.5"/>
  <!-- Tactical officer silhouette with target reticle -->
  <path d="M85,175 C85,120 100,70 128,70 C156,70 171,120 171,175 C171,185 160,190 128,190 C96,190 85,185 85,175 Z" fill="#cc4b37" opacity="0.3"/>
  <!-- Targeting Reticle -->
  <circle cx="128" cy="120" r="30" fill="none" stroke="#cc4b37" stroke-dasharray="8,4" stroke-width="2" filter="url(#glow)"/>
  <line x1="128" y1="80" x2="128" y2="160" stroke="#cc4b37" stroke-width="1.5" opacity="0.7"/>
  <line x1="88" y1="120" x2="168" y2="120" stroke="#cc4b37" stroke-width="1.5" opacity="0.7"/>
  <text x="128" y="215" fill="#cfe8ff" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="1">TAC_04</text>

</svg>