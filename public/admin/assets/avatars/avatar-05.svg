<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="128" fill="#0e2042" stroke="#ebcb4c" stroke-width="4"/>
  <circle cx="128" cy="128" r="90" fill="#000000" opacity="0.5"/>
  <!-- Command officer with collar insignia -->
  <path d="M82,175 C82,120 102,70 128,70 C154,70 174,120 174,175 C174,185 160,190 128,190 C96,190 82,185 82,175 Z" fill="#ebcb4c" opacity="0.4"/>
  <!-- Gilded Collar V-shape -->
  <path d="M100,165 L128,185 L156,165" fill="none" stroke="#ebcb4c" stroke-width="4" filter="url(#glow)"/>
  <!-- Star rank on chest -->
  <path d="M128,105 L132,118 L145,118 L135,126 L139,139 L128,130 L117,139 L121,126 L111,118 L124,118 Z" fill="#ebcb4c" filter="url(#glow)"/>
  <text x="128" y="215" fill="#cfe8ff" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="1">CMD_05</text>

</svg>