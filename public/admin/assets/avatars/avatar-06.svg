<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="128" fill="#0e2042" stroke="#1fd2c4" stroke-width="4"/>
  <circle cx="128" cy="128" r="90" fill="#000000" opacity="0.5"/>
  <!-- Comms Headset / Waveform silhouette -->
  <path d="M85,170 C85,120 102,75 128,75 C154,75 171,120 171,170 Z" fill="#1fd2c4" opacity="0.25"/>
  <!-- Earpiece / waves -->
  <circle cx="160" cy="130" r="10" fill="#1fd2c4" filter="url(#glow)"/>
  <path d="M175,115 C185,120 185,140 175,145" fill="none" stroke="#1fd2c4" stroke-width="2" filter="url(#glow)"/>
  <path d="M68,135 Q100,120 128,135 T188,135" fill="none" stroke="#cfe8ff" stroke-width="1.5" opacity="0.7"/>
  <text x="128" y="215" fill="#cfe8ff" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="1">CMS_06</text>

</svg>