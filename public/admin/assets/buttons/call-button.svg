<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="160" cy="160" r="140" fill="url(#btn-grad)" stroke="#ebcb4c" stroke-width="6" filter="url(#glow-heavy)"/>
  <circle cx="160" cy="160" r="115" fill="none" stroke="#cfe8ff" stroke-width="2" stroke-dasharray="10, 8" opacity="0.6"/>
  <!-- Phone Glyph inside -->
  <path d="M125,120 C125,115 130,110 135,110 C145,110 155,120 155,130 C155,135 150,140 145,145 C155,165 165,175 175,175 C180,170 185,165 190,165 C200,165 210,175 210,185 C210,190 205,195 200,195 C175,195 125,145 125,120 Z" fill="#cfe8ff" filter="url(#glow)"/>
  
  <text x="160" y="240" fill="#cfe8ff" font-family="sans-serif" font-weight="900" font-size="28" text-anchor="middle" letter-spacing="4">INITIATE CALL</text>
  
  <linearGradient id="btn-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2c75ff"/>
    <stop offset="100%" stop-color="#0e2042"/>
  </linearGradient>

</svg>