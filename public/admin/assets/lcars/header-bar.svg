<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Header Bar background -->
  <rect x="10" y="10" width="1180" height="60" rx="30" fill="#000000"/>
  <!-- Outer elbow joints and status plates -->
  <path d="M40,10 L300,10 L300,70 L40,70 C20,70 10,60 10,40 C10,20 20,10 40,10 Z" fill="#ebcb4c"/>
  <path d="M1160,10 L900,10 L900,70 L1160,70 C1180,70 1190,60 1190,40 C1190,20 1180,10 1160,10 Z" fill="#2c75ff"/>
  <rect x="315" y="15" width="120" height="50" fill="#ff9f1c" rx="6"/>
  <rect x="445" y="15" width="20" height="50" fill="#cfe8ff" rx="2"/>
  <text x="110" y="47" fill="#000000" font-family="sans-serif" font-weight="bold" font-size="20">TEXAS AI</text>
  <text x="1080" y="47" fill="#000000" font-family="monospace" font-size="18" text-anchor="middle">HUD_v1.0</text>

</svg>