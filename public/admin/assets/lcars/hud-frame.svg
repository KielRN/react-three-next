<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- HUD bracket outline -->
  <path d="M40,15 L15,15 L15,185 L40,185 M360,15 L385,15 L385,185 L360,185" fill="none" stroke="#cfe8ff" stroke-width="3" opacity="0.6"/>
  <!-- Telemetry marks -->
  <rect x="20" y="25" width="60" height="15" fill="#2c75ff" rx="2"/>
  <rect x="320" y="25" width="60" height="15" fill="#ff9f1c" rx="2"/>
  <text x="25" y="160" fill="#cfe8ff" font-family="monospace" font-size="10" opacity="0.5">SYS.STAT: ACTIVE</text>
  <text x="375" y="160" fill="#cfe8ff" font-family="monospace" font-size="10" text-anchor="end" opacity="0.5">GRID.REF: 402/T</text>

</svg>