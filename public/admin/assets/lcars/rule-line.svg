<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 8" width="1000" height="8">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="8" fill="#2c75ff" rx="4"/>
  <!-- Gaps/Notches in the line -->
  <rect x="200" y="0" width="15" height="8" fill="#0e2042"/>
  <rect x="600" y="0" width="30" height="8" fill="#0e2042"/>
  <rect x="850" y="0" width="10" height="8" fill="#0e2042"/>

</svg>