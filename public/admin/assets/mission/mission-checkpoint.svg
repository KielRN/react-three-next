<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="48" cy="48" r="36" fill="#0e2042" stroke="#cfe8ff" stroke-width="3"/>
  <circle cx="48" cy="48" r="28" fill="#000000"/>
  <!-- Target shape in center -->
  <polygon points="48,28 60,40 48,52 36,40" fill="#ff9f1c" filter="url(#glow)"/>
  <circle cx="48" cy="48" r="10" fill="#ebcb4c" filter="url(#glow)"/>

</svg>