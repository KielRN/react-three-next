<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" rx="24" fill="#0e2042" stroke="#ebcb4c" stroke-width="6"/>
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#cfe8ff" stroke-width="2" stroke-dasharray="10, 10" opacity="0.3"/>
  
  <!-- Victory Crest -->
  <path d="M400,100 L480,240 L600,240 L500,320 L540,460 L400,370 L260,460 L300,320 L200,240 L320,240 Z" fill="#ebcb4c" opacity="0.2" filter="url(#glow-heavy)"/>
  <circle cx="400" cy="270" r="140" fill="none" stroke="#ebcb4c" stroke-width="4" stroke-dasharray="15, 10" filter="url(#glow)"/>
  
  <text x="400" y="280" fill="#ebcb4c" font-family="sans-serif" font-weight="900" font-size="48" text-anchor="middle" letter-spacing="4" filter="url(#glow-heavy)">CAMPAIGN COMPLETE</text>
  <text x="400" y="340" fill="#cfe8ff" font-family="monospace" font-size="18" text-anchor="middle" letter-spacing="2">ALL SECTORS CLEARED — 100% DIAL TARGET REACHED</text>

</svg>