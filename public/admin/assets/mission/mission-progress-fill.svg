<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="7" y="18" width="986" height="28" rx="4" fill="url(#mission-fill-grad)"/>
  <linearGradient id="mission-fill-grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ff9f1c"/>
    <stop offset="100%" stop-color="#ebcb4c"/>
  </linearGradient>

</svg>