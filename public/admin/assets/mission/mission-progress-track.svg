<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="5" y="16" width="990" height="32" rx="6" fill="#000000" stroke="#cfe8ff" stroke-width="2" opacity="0.4"/>
  <!-- Checkpoint notches -->
  <line x1="200" y1="10" x2="200" y2="54" stroke="#cfe8ff" stroke-width="2" opacity="0.5"/><line x1="400" y1="10" x2="400" y2="54" stroke="#cfe8ff" stroke-width="2" opacity="0.5"/><line x1="600" y1="10" x2="600" y2="54" stroke="#cfe8ff" stroke-width="2" opacity="0.5"/><line x1="800" y1="10" x2="800" y2="54" stroke="#cfe8ff" stroke-width="2" opacity="0.5"/>

</svg>