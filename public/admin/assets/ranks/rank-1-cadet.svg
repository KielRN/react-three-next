<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="192" height="192" rx="16" fill="#0e2042" stroke="#cfe8ff" stroke-width="2" opacity="0.3"/>
  <path d="M96,40 L140,130 L52,130 Z" fill="#cfe8ff" stroke="#2c75ff" stroke-width="3"/>
  <rect x="76" y="145" width="40" height="8" fill="#2c75ff" rx="2"/>
  <text x="96" y="180" fill="#cfe8ff" font-family="monospace" font-size="12" text-anchor="middle">CADET</text>

</svg>