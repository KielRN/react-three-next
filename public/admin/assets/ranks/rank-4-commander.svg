<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="192" height="192" rx="16" fill="#0e2042" stroke="#cfe8ff" stroke-width="2" opacity="0.3"/>
  <!-- Winged chevron -->
  <path d="M96,45 L150,90 L135,100 L96,65 L57,100 L42,90 Z" fill="#9b6dff" filter="url(#glow)"/>
  <circle cx="65" cy="115" r="16" fill="#ebcb4c" stroke="#cfe8ff" stroke-width="1.5"/>
  <circle cx="96" cy="115" r="16" fill="#ebcb4c" stroke="#cfe8ff" stroke-width="1.5"/>
  <circle cx="127" cy="115" r="16" fill="#ebcb4c" stroke="#cfe8ff" stroke-width="1.5"/>
  <text x="96" y="175" fill="#cfe8ff" font-family="monospace" font-size="12" text-anchor="middle">COMMANDER</text>

</svg>