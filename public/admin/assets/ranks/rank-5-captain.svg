<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="192" height="192" rx="16" fill="#0e2042" stroke="#cfe8ff" stroke-width="2" opacity="0.3"/>
  <!-- Double bracket command insignia -->
  <path d="M35,50 L45,50 L45,130 L35,130 Z M157,50 L147,50 L147,130 L157,130 Z" fill="#ebcb4c"/>
  <!-- Gilded command star -->
  <path d="M96,40 L101,62 L124,62 L105,75 L112,98 L96,84 L80,98 L87,75 L68,62 L91,62 Z" fill="#ebcb4c" filter="url(#glow)"/>
  <!-- 4 pips below -->
  <circle cx="54" cy="120" r="12" fill="#ebcb4c" stroke="#cfe8ff" stroke-width="1.5"/>
  <circle cx="82" cy="120" r="12" fill="#ebcb4c" stroke="#cfe8ff" stroke-width="1.5"/>
  <circle cx="110" cy="120" r="12" fill="#ebcb4c" stroke="#cfe8ff" stroke-width="1.5"/>
  <circle cx="138" cy="120" r="12" fill="#ebcb4c" stroke="#cfe8ff" stroke-width="1.5"/>
  <text x="96" y="175" fill="#cfe8ff" font-family="monospace" font-size="12" text-anchor="middle">CAPTAIN</text>

</svg>