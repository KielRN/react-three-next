<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="#0e2042" stroke="#1fd2c4" stroke-width="3"/>
  <!-- Shield with big checkmark -->
  <path d="M260,110 L300,90 L340,110 L340,180 C340,220 300,240 300,240 C300,240 260,220 260,180 Z" fill="none" stroke="#1fd2c4" stroke-width="4"/>
  <path d="M275,150 L295,170 L325,130" fill="none" stroke="#ebcb4c" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  
  <text x="300" y="295" fill="#1fd2c4" font-family="monospace" font-size="22" text-anchor="middle" letter-spacing="3" filter="url(#glow)">MISSION COMPLETED</text>
  <text x="300" y="330" fill="#cfe8ff" font-family="sans-serif" font-size="14" text-anchor="middle" opacity="0.6">ALL OUTCOMES LOGGED • WEEKLY CAMPAIGN SECURED</text>

</svg>