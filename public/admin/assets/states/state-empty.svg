<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="#0e2042" stroke="#2c75ff" stroke-width="3"/>
  <circle cx="300" cy="160" r="80" fill="none" stroke="#2c75ff" stroke-dasharray="8, 6" stroke-width="2" opacity="0.5"/>
  <circle cx="300" cy="160" r="40" fill="none" stroke="#2c75ff" stroke-width="1.5" opacity="0.3"/>
  <line x1="300" y1="60" x2="300" y2="260" stroke="#2c75ff" stroke-width="1" opacity="0.3"/>
  <line x1="200" y1="160" x2="400" y2="160" stroke="#2c75ff" stroke-width="1" opacity="0.3"/>
  <path d="M260,130 L340,190 M340,130 L260,190" stroke="#cc4b37" stroke-width="2" filter="url(#glow)"/>
  
  <text x="300" y="280" fill="#cfe8ff" font-family="monospace" font-size="20" text-anchor="middle" letter-spacing="2">NO LEADS ASSIGNED</text>
  <text x="300" y="315" fill="#cfe8ff" font-family="sans-serif" font-size="14" text-anchor="middle" opacity="0.6">MISSION COLD-CALL TARGETS DEPLETED FOR THIS SECTOR</text>

</svg>