<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="#0e2042" stroke="#ebcb4c" stroke-width="3"/>
  <circle cx="300" cy="170" r="60" fill="none" stroke="#ebcb4c" stroke-width="4" stroke-dasharray="120, 20, 60, 20" filter="url(#glow)"/>
  <circle cx="300" cy="170" r="45" fill="none" stroke="#ff9f1c" stroke-width="2" stroke-dasharray="40, 10" opacity="0.7"/>
  <text x="300" y="280" fill="#ebcb4c" font-family="monospace" font-size="20" text-anchor="middle" letter-spacing="3" filter="url(#glow)">SCANNING FOR TARGETS...</text>
  <text x="300" y="315" fill="#cfe8ff" font-family="monospace" font-size="12" text-anchor="middle" opacity="0.5">ESTABLISHING SUB-SPACE LINK • DATA PACKETS QUEUED</text>

</svg>