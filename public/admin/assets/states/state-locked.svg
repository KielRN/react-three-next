<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="#0e2042" stroke="#cc4b37" stroke-width="3"/>
  <!-- Padlock Outline -->
  <path d="M260,180 L340,180 L340,260 L260,260 Z M275,180 L275,145 C275,120 325,120 325,145 L325,180" fill="none" stroke="#cc4b37" stroke-width="6" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="300" cy="215" r="8" fill="#cc4b37"/>
  <line x1="300" y1="223" x2="300" y2="243" stroke="#cc4b37" stroke-width="3"/>
  
  <text x="300" y="310" fill="#cc4b37" font-family="monospace" font-weight="bold" font-size="22" text-anchor="middle" letter-spacing="3" filter="url(#glow)">SECURE CHANNEL RESTRICTED</text>
  <text x="300" y="340" fill="#cfe8ff" font-family="sans-serif" font-size="14" text-anchor="middle" opacity="0.6">ADMIN ACCESS REQUIRED • EMAIL PERMISSION NOT DEPLOYED</text>

</svg>