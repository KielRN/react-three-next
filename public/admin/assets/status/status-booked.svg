<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="60" height="60" x="2" y="2" rx="8" fill="#0e2042" stroke="#1fd2c4" stroke-width="2"/>
  <g stroke="#1fd2c4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
  <path d="M18,24 L32,14 L46,24 L46,38 C46,46 32,52 32,52 C32,52 18,46 18,38 Z" fill="none" stroke-width="2.5"/>
  <path d="M26,30 L31,35 L40,24" stroke-width="3" stroke="{TEAL}" filter="url(#glow)"/>

  </g>

</svg>