<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="60" height="60" x="2" y="2" rx="8" fill="#0e2042" stroke="#cc4b37" stroke-width="2"/>
  <g stroke="#cc4b37" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
  <polygon points="32,10 52,48 12,48" stroke="{RUST}" stroke-width="2"/>
  <line x1="32" y1="22" x2="32" y2="36" stroke="{RUST}" stroke-width="3"/>
  <circle cx="32" cy="42" r="2" fill="{RUST}" stroke="none"/>

  </g>

</svg>