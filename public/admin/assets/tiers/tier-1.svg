<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="192" height="192" rx="24" fill="#0e2042" stroke="#2c75ff" stroke-width="3" filter="url(#glow)"/>
  <circle cx="96" cy="85" r="45" fill="#000000" stroke="#cfe8ff" stroke-width="1.5"/>
  <!-- Concentric inner detail -->
  <circle cx="96" cy="85" r="35" fill="none" stroke="#2c75ff" stroke-dasharray="5, 3"/>
  
  <!-- Tier indicator circles/shapes -->
  <polygon points="96,65 106,85 126,85 110,97 116,117 96,105 76,117 82,97 66,85 86,85" fill="#ebcb4c" filter="url(#glow)"/>
  
  <text x="96" y="155" fill="#cfe8ff" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle" letter-spacing="2">TIER 1</text>

</svg>