<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 48" width="600" height="48">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Segmented LCARS-style bar blocks -->
  <g fill="url(#fill-grad)">
    <rect x="10" y="6" width="24" height="36" rx="3"/><rect x="39" y="6" width="24" height="36" rx="3"/><rect x="68" y="6" width="24" height="36" rx="3"/><rect x="97" y="6" width="24" height="36" rx="3"/><rect x="126" y="6" width="24" height="36" rx="3"/><rect x="155" y="6" width="24" height="36" rx="3"/><rect x="184" y="6" width="24" height="36" rx="3"/><rect x="213" y="6" width="24" height="36" rx="3"/><rect x="242" y="6" width="24" height="36" rx="3"/><rect x="271" y="6" width="24" height="36" rx="3"/><rect x="300" y="6" width="24" height="36" rx="3"/><rect x="329" y="6" width="24" height="36" rx="3"/><rect x="358" y="6" width="24" height="36" rx="3"/><rect x="387" y="6" width="24" height="36" rx="3"/><rect x="416" y="6" width="24" height="36" rx="3"/><rect x="445" y="6" width="24" height="36" rx="3"/><rect x="474" y="6" width="24" height="36" rx="3"/><rect x="503" y="6" width="24" height="36" rx="3"/><rect x="532" y="6" width="24" height="36" rx="3"/><rect x="561" y="6" width="24" height="36" rx="3"/>
  </g>
  <linearGradient id="fill-grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2c75ff"/>
    <stop offset="50%" stop-color="#9b6dff"/>
    <stop offset="100%" stop-color="#1fd2c4"/>
  </linearGradient>

</svg>