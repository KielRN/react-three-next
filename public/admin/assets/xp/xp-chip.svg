<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <polygon points="32,4 60,20 60,52 32,60 4,52 4,20" fill="#0e2042" stroke="#2c75ff" stroke-width="2"/>
  <polygon points="28,10 52,24 52,46 28,54 12,46 12,24" fill="#000000" opacity="0.6"/>
  <text x="32" y="38" fill="#cfe8ff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" filter="url(#glow)">XP</text>
  <line x1="20" y1="46" x2="44" y2="46" stroke="#ebcb4c" stroke-width="2"/>

</svg>